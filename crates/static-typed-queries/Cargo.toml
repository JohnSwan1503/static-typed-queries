[package]
name = "static-typed-queries"
description = "Composable SQL statements for sqlx, checked and rendered at compile time"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["sql", "sqlx", "query-builder", "compile-time", "database"]
categories = ["database"]

[features]
default = []
all = ["mysql", "postgres", "sqlite"]
mysql = ["static-typed-queries-core/mysql"]
postgres = ["static-typed-queries-core/postgres"]
sqlite = ["static-typed-queries-core/sqlite"]
parse-check = ["static-typed-queries-core/parse-check"]

[package.metadata.docs.rs]
features = ["all", "parse-check"]

[dependencies]
static-typed-queries-core.workspace = true
static-typed-queries-macros.workspace = true

[dev-dependencies]
static-typed-queries = { path = ".", features = ["mysql", "postgres", "sqlite", "parse-check"] }
sqlx = { workspace = true, features = ["macros", "runtime-tokio", "sqlite"] }
tokio.workspace = true
trybuild.workspace = true
