[package]
name = "static-typed-queries-core"
version = "0.0.0"
edition = "2024"

[features]
default = []
mysql = ["sqlx/mysql"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
parse-check = ["dep:sqlparser"]

[dependencies]
sqlparser = { version = "0.63.0", optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
static-typed-queries-core = { path = ".", features = ["mysql", "postgres", "sqlite", "parse-check"] }
sqlx = { workspace = true, features = ["runtime-tokio"] }
tokio.workspace = true
trybuild.workspace = true
