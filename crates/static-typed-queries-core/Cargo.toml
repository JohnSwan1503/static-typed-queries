[package]
name = "static-typed-queries-core"
description = "Runtime support for static-typed-queries; depend on that crate instead"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
mysql = ["sqlx/mysql"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
parse-check = ["dep:sqlparser"]

[dependencies]
sqlparser = { version = "0.63.0", optional = true }
sqlx = { workspace = true, optional = true }

[dev-dependencies]
static-typed-queries-core = { path = ".", features = ["mysql", "postgres", "sqlite", "parse-check"] }
sqlx = { workspace = true, features = ["macros", "runtime-tokio"] }
tokio.workspace = true
trybuild.workspace = true
