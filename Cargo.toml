[workspace]
members = [
    "crates/static-typed-queries",
    "crates/static-typed-queries-macros",
    "crates/static-typed-queries-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"

[workspace.dependencies]

# Workspace Crates, pinned exactly since generated code uses their hidden items
static-typed-queries-core = { path = "crates/static-typed-queries-core", version = "=0.1.0" }
static-typed-queries-macros = { path = "crates/static-typed-queries-macros", version = "=0.1.0" }

# Compile-time SQL Validation, Sanitization, Interface
sqlx = { version = "0.9.0", default-features = false }

# Compile-fail Tests
trybuild = "1.0.121"

# Test Runtime
tokio = { version = "1.53.1", features = ["macros", "rt"] }
